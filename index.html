<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incanto Parolum</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6E56CF">
<meta name="description" content="Incanto Parolum: la scuola di magia delle parole. 10 minuti al giorno di grammatica italiana.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EC;--ink:#2B2340;--muted:#6F6888;--card:#fff;--line:#EDE6DA;--pri:#6E56CF;--pri-d:#5241A8;--ok:#21A366;--ok-d:#178050;--ok-s:#E3F7EC;--bad:#E5484D;--bad-d:#B8353A;--bad-s:#FDECEC;--gold:#FFC53D;--c:#6E56CF;--s:#ECE6FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45}
#app{max-width:820px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:2rem;margin:.2em 0;font-weight:900}h2{font-size:1.45rem;margin:.2em 0 .4em;font-weight:900}h3{font-size:1.05rem;margin:1.2em 0 .5em;font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 0 var(--line)}
.center{text-align:center}
.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--ink);padding:11px 20px;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pri);border-color:var(--pri-d);color:#fff;box-shadow:0 4px 0 var(--pri-d)}
.btn.warn{background:var(--bad);border-color:var(--bad-d);color:#fff;box-shadow:0 4px 0 var(--bad-d)}
.btn.ghost{background:transparent}
.btn.big{display:block;width:100%;font-size:1.15rem;padding:15px;margin-top:14px}
.inp{font:inherit;width:100%;max-width:340px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin:6px 0 10px;text-align:center}
.inp:focus{outline:none;border-color:var(--pri)}
.ta{max-width:100%;height:110px;text-align:left;font-size:.75rem;font-family:ui-monospace,monospace}
.lbl{display:block;font-weight:800;margin-top:10px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.95rem;display:flex;align-items:center;gap:6px}
.pill.lv .mini{display:inline-block;width:54px;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pill.lv .mini i{display:block;height:100%;background:var(--gold)}
.top.sess{justify-content:space-between}.phase{font-weight:900;flex:1}.phase small{color:var(--muted);font-weight:700}
.x{font:inherit;font-size:1.1rem;border:none;background:none;cursor:pointer;color:var(--muted);padding:4px 8px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px auto;max-width:380px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F1C);border-radius:99px;transition:width .5s}
.bar.prog{max-width:none;margin:10px 0 0}.bar.prog i{background:var(--ok)}
.bar.thin{display:inline-block;height:8px;width:70px;vertical-align:middle;margin:0 4px}.bar.thin i{background:var(--c)}
.big-emoji{font-size:5.5rem;line-height:1.1;display:inline-block}
.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
.wob{animation:wob 2.4s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(0)}}
.hero p{max-width:520px;margin:10px auto}
.hi{font-size:1.1rem;margin-top:0}
.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mission div{background:var(--bg);border-radius:14px;padding:10px 12px}.mission small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:.8rem}
/* mappa */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.col{background:var(--s);border-radius:18px;padding:10px}.col h3{color:var(--c);margin:.2em .2em .6em;text-align:center}
.node{font:inherit;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.node .ni{font-size:1.5rem}.node .nt{flex:1;font-size:.88rem;line-height:1.25}.node .nt b{display:block}.node .nt small{color:var(--muted)}.node .nb{font-size:1.1rem}
.node.locked{opacity:.55;cursor:not-allowed;box-shadow:none}
.node.done{border-color:var(--gold)}.node.focus{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
/* esercizi */
.qcard{border-color:var(--s)}
.qtag{display:inline-block;background:var(--s);color:var(--c);font-weight:800;font-size:.85rem;border-radius:99px;padding:3px 12px}
.q{font-size:1.3rem;font-weight:800;margin:16px 0}
.q.cloze{font-size:1.45rem}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--c);color:var(--c);text-align:center}
.blank.right{color:var(--ok);border-color:var(--ok);border-bottom-style:solid}.blank.fixed{color:var(--bad);border-color:var(--bad);border-bottom-style:solid}
.opts{display:grid;gap:10px}
.opt,.chunk{font:inherit;font-weight:800;font-size:1.15rem;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 16px;cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.opt:hover:not(:disabled),.chunk:hover:not(:disabled){border-color:var(--c)}
.opt kbd{display:inline-block;min-width:24px;margin-right:10px;color:var(--muted);font-family:inherit;font-size:.8rem;border:2px solid var(--line);border-radius:7px;text-align:center}
.chunks{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chunk{font-size:1.3rem;padding:12px 16px}
.right{background:var(--ok-s)!important;border-color:var(--ok)!important;box-shadow:0 4px 0 var(--ok)!important}
.wrong{background:var(--bad-s)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button:disabled{cursor:default}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px}
.fb.good{background:var(--ok-s);color:var(--ok-d)}.fb.bad{background:var(--bad-s);color:var(--bad-d)}
.fb p{margin:.3em 0;color:var(--ink)}
.fb-t{font-weight:900;font-size:1.25rem}.gain{background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 10px;font-size:.9rem;margin-left:6px}
.fb .btn{margin-top:10px}
.mini-fb{font-weight:900;text-align:center}
.mastered{background:#FFF4D6;border-radius:12px;padding:8px 12px;font-weight:800}
.note{background:var(--bg);border-radius:12px;padding:8px 12px}.note.bad{color:var(--bad-d)}
/* lezione */
.lesson{border-color:var(--c)}
.lesson-h{display:flex;gap:14px;align-items:center}.lesson-h .ni{font-size:2.6rem;background:var(--s);border-radius:16px;padding:6px 12px}.lesson-h small{color:var(--c);font-weight:800}
.rule{background:var(--s);border-radius:16px;padding:14px 16px;margin:14px 0;font-size:1.08rem}
.ex{padding-left:1.2em}.ex li{margin:6px 0}
/* raffica */
.timer{position:relative;height:26px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF6B6B,var(--gold));transition:width .2s linear}
.timer b{position:absolute;inset:0;text-align:center;font-size:.9rem;line-height:26px}
/* fine sessione / stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--bg);border-radius:14px;padding:10px}.stats b{display:block;font-size:1.4rem}.stats small{color:var(--muted);font-size:.78rem}
.evo{position:relative;height:6.5rem}.evo .big-emoji{position:absolute;left:50%;transform:translateX(-50%)}
.fade-out{animation:fo 1.2s forwards}@keyframes fo{60%{opacity:1;transform:translateX(-50%) scale(1.2)}100%{opacity:0;transform:translateX(-50%) scale(.2)}}
.pop{opacity:0;animation:pop .8s 1.1s forwards}@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.2)}70%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
/* diagnosi */
.diag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.diag-area{background:var(--s);border-radius:16px;padding:10px 12px}.diag-area h3{color:var(--c);margin:.2em 0 .4em}
.diag-area ul{list-style:none;padding:0;margin:0;font-size:.88rem}.diag-area li{margin:6px 0}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:4px}
.tag.ok{background:var(--ok-s);color:var(--ok-d)}.tag.mid{background:#FFF4D6;color:#9A6B00}.tag.lo{background:var(--bad-s);color:var(--bad-d)}
/* genitori */
.stats.left{text-align:center}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:420px}
.dday{aspect-ratio:1;border-radius:6px;background:var(--line)}.dday.on{background:var(--ok)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}.tbl th{font-size:.78rem;color:var(--muted)}.tbl small{color:var(--muted)}
.tbl .bar.thin i{background:var(--pri)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;transition:transform .25s;z-index:9}
#toast.show{transform:translateX(-50%) translateY(0)}
/* esercizi da scrivere */
.hint{color:var(--muted);margin:-6px 0 12px;font-weight:700}
.typebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp.ans{max-width:none;flex:1;min-width:200px;margin:0;text-align:left;font-size:1.25rem;font-weight:800}
.inp.ans.right{border-color:var(--ok);background:var(--ok-s)}.inp.ans.wrong{border-color:var(--bad);background:var(--bad-s)}
.accents{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acc{font:inherit;font-weight:800;min-width:40px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.later{font-size:.8rem;background:#fff;border-radius:10px;padding:6px 8px;margin:0 0 8px;color:var(--muted)}
#oops{position:fixed;inset:0;background:rgba(43,35,64,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.oops-card{background:#fff;border-radius:22px;padding:24px;text-align:center;max-width:340px}
/* carica, collezione, schiusa */
.pill.energy{font-size:.85rem}.pill.energy.full{background:#FFF8D6;border-color:#FFC53D}
.hatch{margin:10px auto 0;display:block}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.coll-item{background:var(--bg);border-radius:16px;padding:8px;text-align:center}.coll-item.cur{outline:3px solid var(--gold)}
.coll-item b{display:block;font-size:.9rem}.coll-item small{color:var(--muted);font-size:.75rem}
.q-mark.big{width:110px;height:110px;font-size:3rem}
.hatch-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.hatch-row small{display:block;color:var(--muted);font-weight:800}.hatch-row .arrow{font-size:2rem;color:var(--muted)}
.motto{margin:-4px 0 6px;font-style:italic;color:var(--muted);font-weight:700}
.formula{display:block;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
/* duello */
.duel-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.vs{font-size:2rem;font-weight:900;color:var(--bad)}
.duel-rules{background:var(--bg);border-radius:14px;padding:10px 14px;text-align:left;margin:10px 0}.duel-rules p{margin:.35em 0}
.duel-hud{display:flex;align-items:center;gap:10px;margin:10px 0}.hpwrap{flex:1;text-align:center}.hpwrap small{font-weight:800;color:var(--muted)}
.hpbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#E5484D,#FF8A3D);transition:width .5s}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spell{font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 8px;cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:center}
.spell:hover{border-color:var(--pri)}.spell .si{font-size:2rem}.spell small{color:var(--muted);font-size:.78rem}
.stag{font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;background:var(--bg);color:var(--muted)}
.stag.weak{background:#FFE8D7;color:#B54708}.stag.res{background:#E6E8EF;color:#4B4F63}.stag.ins{background:#FFF4D6;color:#9A6B00}.stag.chain{background:#ECE6FF;color:var(--pri-d)}
.dmg{background:var(--bad);color:#fff;border-radius:99px;padding:1px 10px;font-size:.9rem;margin-left:6px}
.monster.hit{animation:shake .4s}
.duel-banner{display:flex;align-items:center;gap:12px;border-color:#FFB4A0;background:#FFF5F0}
@media (max-width:640px){.hand{grid-template-columns:1fr}.spell{flex-direction:row;justify-content:flex-start;gap:8px;text-align:left}.spell small{display:none}}
/* novità */
.errs{display:grid;gap:8px}.errs>div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.9rem}
.errw{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin:3px 3px 0 0;font-weight:700}
.news{color:#B54708;font-weight:800}
/* sincronizzazione */
.btn.small{font-size:.85rem;padding:7px 12px;box-shadow:none}
.syncbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.syncbox label{font-size:.82rem;font-weight:800;color:var(--muted)}.syncbox .inp{text-align:left;max-width:none;font-size:.95rem}
.row.left{justify-content:flex-start}.row.left .inp{max-width:260px;margin:0;text-align:left}
@media (max-width:640px){.syncbox{grid-template-columns:1fr}}
/* telefono */
@media (pointer:coarse){.accents{display:none}}
@media (max-width:640px){.phase small{display:none}.phase{font-size:.92rem}.top.sess{flex-wrap:nowrap}.btn.perk small{display:none}}
/* poteri attivi */
.btn.perk{margin-top:12px;font-size:.92rem;background:#EAF8FF;border-color:#7CC8F0;box-shadow:0 4px 0 #7CC8F0}.btn.perk small{color:var(--muted)}
.gone{opacity:.25;text-decoration:line-through}
.perk-up{background:linear-gradient(90deg,#EAF8FF,#E6F0FF)}
h4.sub{margin:14px 0 6px}
.dragon.scene{border-radius:26px}
/* combo */
.pill.combo{transition:transform .2s}.pill.combo.hot{background:#FFF0E0;border-color:#FF9F1C;color:#B54708;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cmb{background:#FF9F1C;color:#fff;border-radius:99px;padding:1px 9px;font-size:.85rem;margin-left:4px;font-weight:900}
.soft{background:#FFF4D6;border-radius:10px;padding:6px 10px;color:var(--ink)!important}
.combo-pop{position:fixed;left:50%;top:62%;transform:translate(-50%,-50%);font-size:2.6rem;font-weight:900;color:#FF7A00;text-shadow:0 3px 0 #FFE0B2;pointer-events:none;animation:cpop 1.1s ease-out forwards;z-index:15}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* compagno, tana, poteri */
.petbox{display:inline-block}.dragon{display:block;margin:0 auto;overflow:visible}
.powers{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.pw{font-size:1.3rem;background:#FFF4D6;border-radius:12px;padding:3px 7px;cursor:help}.pw-n{font-size:.8rem;color:var(--muted);font-weight:800}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-size:.72rem;font-weight:900;vertical-align:middle}
.levelup{background:linear-gradient(90deg,#FFF4D6,#FFE7B0);border-radius:16px;padding:10px 14px;margin:10px 0}.levelup p{margin:.3em 0}.levelup small{color:var(--muted)}
.pw-up{background:linear-gradient(90deg,#ECE6FF,#DDF5EA)}
.den{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.den-pet{text-align:center;position:sticky;top:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer}.tab.on{background:var(--pri);color:#fff;border-color:var(--pri-d)}
.slot h4{margin:12px 0 6px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:.88rem;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 11px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip.on{border-color:var(--pri);background:#ECE6FF;box-shadow:0 3px 0 var(--pri)}
.chip.lock{opacity:.5;cursor:not-allowed;box-shadow:none}.chip small{color:var(--muted)}
.powers-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.power{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px;opacity:.6}.power.got{opacity:1;background:#FFF4D6}
.power .pi{font-size:1.6rem}.power small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.evo-line{display:flex;flex-wrap:wrap;gap:8px}
.evo-step{width:84px;text-align:center;background:var(--bg);border-radius:14px;padding:6px 4px;font-size:.75rem;opacity:.7}.evo-step.got{opacity:1}.evo-step.cur{outline:3px solid var(--gold)}
.evo-step small{display:block;font-weight:800;color:var(--muted)}
.q-mark{width:70px;height:70px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:var(--muted)}
.evo{position:relative;height:180px}.evo>span{position:absolute;left:50%;transform:translateX(-50%)}
@media (max-width:640px){.den{grid-template-columns:1fr}.den-pet{position:static}.powers-grid{grid-template-columns:1fr}}
@media (max-width:640px){.map,.diag-grid{grid-template-columns:1fr}.mission{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}html,body{font-size:16px}}
</style>

<body>
<main id="app"></main>
<script>
// ============================================================
//  MISSIONE GRAMMATICA — Banca contenuti v0.1
//  Formato esercizi:
//   mc    : scelta multipla        { q, o:[corretta, ...distrattori], x }
//   cloze : frase con ___          { q, o:[corretta, ...distrattori], x }
//   pick  : tocca la parte giusta  { q, c:[pezzi della frase], a:indice, x }
//   type  : scrivi la risposta     { q (con ___), a:[risposte accettate], hint, say:parola da dettare, x }
//   d:1   = usato nel test d'ingresso (2 per abilità)
//  La prima opzione è SEMPRE quella corretta (l'app le mescola).
// ============================================================

const AREAS = [
  { id: "ort", name: "Ortografia", color: "#F76B15", soft: "#FFE8D7" },
  { id: "gr",  name: "Grammatica", color: "#6E56CF", soft: "#ECE6FF" },
  { id: "log", name: "Analisi logica", color: "#1F9D6B", soft: "#DDF5EA" },
];

const SKILLS = [
  { id: "ort_h", area: "ort", icon: "🔤", name: "L'H muta", pre: [],
    rule: "<b>ho, hai, ha, hanno</b> sono il verbo <b>avere</b> e vogliono l'h. <br>Trucco: prova a sostituire con <b>avevo / aveva / avevano</b>. Se la frase ha ancora senso, ci vuole l'h.",
    ex: ["Io <b>ho</b> fame → io <i>avevo</i> fame ✔ (verbo avere)", "Vuoi pane <b>o</b> pizza? → «avevo» non ha senso: niente h", "Vado <b>a</b> Roma · È passato un <b>anno</b>"] },

  { id: "nom2", s: "gr_nome", t: "mc", q: "Il plurale di «uovo» è:", o: ["le uova", "gli uovi", "le uove"], x: "«uovo» ha un plurale irregolare e diventa femminile: le uova.", d: 1 },

  { id: "nom5", s: "gr_nome", t: "mc", q: "Il plurale di «re» è:", o: ["i re", "i rei", "i ri"], x: "I nomi di una sola sillaba non cambiano al plurale: il re → i re." },

  { id: "nom7", s: "gr_nome", t: "mc", q: "«Coraggio» è un nome:", o: ["astratto", "concreto"], x: "Il coraggio non si può toccare né vedere: è un nome astratto." },
  { id: "nom8", s: "gr_nome", t: "mc", q: "Quale parola NON è un nome?", o: ["correre", "sedia", "libertà", "Anna"], x: "«correre» è un verbo all'infinito." },
  { id: "nom9", s: "gr_nome", t: "mc", q: "Il plurale di «amico» è:", o: ["amici", "amichi", "amice"], x: "amico → amici (ma attenzione: fuoco → fuochi!)." },
  { id: "nom10", s: "gr_nome", t: "mc", q: "«Problema» è un nome:", o: ["maschile", "femminile"], x: "Si dice «il problema»: è maschile, anche se finisce in -a." },

  // ---------------- GRAMMATICA: AGGETTIVI ----------------
  { id: "agg1", s: "gr_agg", t: "pick", q: "Tocca l'AGGETTIVO:", c: ["Ho", "una", "bici", "rossa."], a: 3, x: "«rossa» dice com'è la bici: è un aggettivo qualificativo.", d: 1 },
  { id: "agg2", s: "gr_agg", t: "cloze", q: "Le mie compagne sono ___.", o: ["simpatiche", "simpatici", "simpatica"], x: "«compagne» è femminile plurale: simpatiche.", d: 1 },

  { id: "agg4", s: "gr_agg", t: "cloze", q: "I libri ___ sono sul tavolo.", o: ["nuovi", "nuove", "nuovo"], x: "«libri» è maschile plurale: nuovi." },
  { id: "agg5", s: "gr_agg", t: "mc", q: "«Bellissimo» è un aggettivo di grado:", o: ["superlativo assoluto", "comparativo", "positivo"], x: "Il suffisso -issimo forma il superlativo assoluto." },
  { id: "agg6", s: "gr_agg", t: "mc", q: "In «Luca è più alto di Marco», «più alto» è un:", o: ["comparativo di maggioranza", "superlativo relativo", "comparativo di minoranza"], x: "«più … di» confronta due persone: comparativo di maggioranza." },
  { id: "agg7", s: "gr_agg", t: "cloze", q: "Ho comprato delle scarpe ___.", o: ["comode", "comodi", "comoda"], x: "«scarpe» è femminile plurale: comode." },
  { id: "agg8", s: "gr_agg", t: "mc", q: "Quale parola è un aggettivo?", o: ["felice", "felicità", "felicemente"], x: "«felice» descrive un nome; «felicità» è un nome, «felicemente» un avverbio." },
  { id: "agg9", s: "gr_agg", t: "pick", q: "Tocca l'AGGETTIVO:", c: ["La", "strada", "lunga", "porta", "al", "paese."], a: 2, x: "«lunga» dice com'è la strada. (Qui «porta» è un verbo!)" },
  { id: "agg10", s: "gr_agg", t: "cloze", q: "Mia sorella è ___ di me.", o: ["più giovane", "più giovanissima", "giovanissima"], x: "Per confrontare si usa «più … di». «Più giovanissima» è sempre sbagliato." },

  // ---------------- GRAMMATICA: VERBO ----------------
  { id: "vb1", s: "gr_verbo", t: "pick", q: "Tocca il VERBO:", c: ["Il", "cane", "abbaia", "forte."], a: 2, x: "Prova al passato: il cane abbaiava → cambia «abbaia»: è il verbo.", d: 1 },
  { id: "vb2", s: "gr_verbo", t: "pick", q: "Tocca il VERBO:", c: ["La", "porta", "del", "bagno", "è", "rotta."], a: 4, x: "Il verbo è «è» (verbo essere). Qui «porta» è un nome!", d: 1 },

  { id: "vb4", s: "gr_verbo", t: "pick", q: "Tocca il VERBO:", c: ["Giulia", "legge", "un", "libro."], a: 1, x: "«legge» è il verbo leggere." },
  { id: "vb5", s: "gr_verbo", t: "mc", q: "Quale parola è un verbo?", o: ["cantare", "canzone", "cantante"], x: "«cantare» è un verbo all'infinito; gli altri sono nomi." },
  { id: "vb6", s: "gr_verbo", t: "mc", q: "L'infinito di «andavo» è:", o: ["andare", "andere", "andire"], x: "andavo → andare (1ª coniugazione)." },
  { id: "vb7", s: "gr_verbo", t: "mc", q: "«Correre» appartiene alla:", o: ["2ª coniugazione (-ere)", "1ª coniugazione (-are)", "3ª coniugazione (-ire)"], x: "I verbi in -ere sono della 2ª coniugazione." },
  { id: "vb8", s: "gr_verbo", t: "mc", q: "«Dormire» appartiene alla:", o: ["3ª coniugazione (-ire)", "1ª coniugazione (-are)", "2ª coniugazione (-ere)"], x: "I verbi in -ire sono della 3ª coniugazione." },
  { id: "vb9", s: "gr_verbo", t: "mc", q: "L'infinito di «fecero» è:", o: ["fare", "fecere", "facere"], x: "fecero → fare (passato remoto: essi fecero)." },
  { id: "vb10", s: "gr_verbo", t: "mc", q: "Quale parola NON è un verbo?", o: ["velocemente", "saltare", "scrivo", "parlano"], x: "«velocemente» è un avverbio: dice come si fa qualcosa." },

  // ---------------- GRAMMATICA: TEMPI ----------------
  { id: "tp1", s: "gr_tempi", t: "mc", q: "«Io mangiavo» è:", o: ["imperfetto", "passato prossimo", "presente"], x: "-avo, -evo, -ivo: è l'imperfetto.", d: 1 },
  { id: "tp2", s: "gr_tempi", t: "cloze", q: "Ieri io ___ al cinema.", o: ["sono andato", "andrò", "vado"], x: "«Ieri» → azione passata e conclusa: passato prossimo.", d: 1 },
  { id: "tp3", s: "gr_tempi", t: "mc", q: "«Noi abbiamo giocato» è:", o: ["passato prossimo", "trapassato prossimo", "imperfetto"], x: "Presente di avere (abbiamo) + participio: passato prossimo." },
  { id: "tp4", s: "gr_tempi", t: "mc", q: "«Loro partiranno» è:", o: ["futuro semplice", "presente", "passato remoto"], x: "-rò, -rai, -ranno: è il futuro." },
  { id: "tp5", s: "gr_tempi", t: "mc", q: "«Tu corresti» è:", o: ["passato remoto", "imperfetto", "futuro semplice"], x: "io corsi, tu corresti, egli corse: passato remoto." },
  { id: "tp6", s: "gr_tempi", t: "mc", q: "«Lei aveva dormito» è:", o: ["trapassato prossimo", "passato prossimo", "imperfetto"], x: "Imperfetto di avere (aveva) + participio: trapassato prossimo." },
  { id: "tp7", s: "gr_tempi", t: "cloze", q: "Domani noi ___ i nonni.", o: ["visiteremo", "abbiamo visitato", "visitavamo"], x: "«Domani» → futuro: visiteremo." },
  { id: "tp8", s: "gr_tempi", t: "cloze", q: "Da piccolo, ogni estate ___ al mare.", o: ["andavo", "andrò", "vado"], x: "Azione abituale nel passato: imperfetto." },
  { id: "tp9", s: "gr_tempi", t: "mc", q: "Il passato prossimo di «io scrivo» è:", o: ["io ho scritto", "io scrissi", "io scrivevo"], x: "ho (avere) + scritto (participio) = passato prossimo." },
  { id: "tp10", s: "gr_tempi", t: "mc", q: "«Voi siete stati» è:", o: ["passato prossimo", "trapassato prossimo", "futuro anteriore"], x: "Presente di essere (siete) + participio: passato prossimo." },

  // ---------------- GRAMMATICA: PRONOMI ----------------
  { id: "pr1", s: "gr_pron", t: "cloze", q: "Ho visto Marco e ___ salutato.", o: ["l'ho", "gli ho", "le ho"], x: "Ho salutato chi? lui → lo → l'ho salutato.", d: 1 },

  { id: "pr5", s: "gr_pron", t: "mc", q: "Quale è un pronome personale SOGGETTO?", o: ["noi", "ci", "vi", "li"], x: "Soggetto: io, tu, lui, lei, noi, voi, loro." },

  { id: "co1", s: "log_ogg", t: "pick", q: "Tocca il COMPLEMENTO OGGETTO:", c: ["Luca", "mangia", "una mela."], a: 2, x: "Luca mangia che cosa? Una mela.", d: 1 },

  // ---------------- v1.3: TROVA IL VERBO (frasi insidiose) ----------------

  { id: "vb11", s: "gr_verbo", t: "pick", q: "Tocca il VERBO:", c: ["Ieri", "Marco", "ha mangiato", "una pizza."], a: 2, x: "«ha mangiato» è un verbo composto: ausiliare (ha) + participio (mangiato) formano un solo verbo." },

  // verbo in posizioni insolite
  { id: "vb17", s: "gr_verbo", t: "pick", q: "Tocca il VERBO:", c: ["Una storia", "alla sera", "racconta", "la nonna."], a: 2, x: "«racconta» è il verbo: chi racconta? la nonna, che sta in fondo." },

  { id: "vb20", s: "gr_verbo", t: "pick", q: "Tocca il VERBO:", c: ["Luca", "porta", "lo zaino", "a scuola."], a: 1, x: "Qui «porta» è il verbo portare: Luca porta lo zaino." },

  if (isDragon && av.horns === "short") b += both(`<path d="M78 46 Q70 30 72 22 Q82 32 88 40 Z" fill="#FFF3D6" stroke="#D9C49A" stroke-width="2" stroke-linejoin="round"/>`);

  if (isDragon && av.horns === "crystal") b += both(`<path d="M76 46 L62 14 L74 22 L76 8 L88 40 Z" fill="#BDEBFF" stroke="#5FB8E8" stroke-width="2" stroke-linejoin="round"/><path d="M70 26 L76 38" stroke="#fff" stroke-width="2"/>`);

  // ---- TESTA ----

const MONSTERS = [

function monsterSVG(m, size = 180, hurt = false) {
  const words = ["tacquino", "lezzione", "perchè", "qual'è", "squola"];
  let s = `<ellipse cx="100" cy="182" rx="56" ry="7" fill="#000" opacity=".08"/>`;

  s += `<path d="M38 150 Q20 90 60 64 Q100 40 140 64 Q182 90 164 150 Q160 178 132 176 L120 168 L110 178 L100 168 L90 178 L80 168 L68 176 Q42 178 38 150 Z" fill="${m.c}" stroke="${m.d}" stroke-width="3"/>`;
  s += `<circle cx="60" cy="140" r="9" fill="${m.d}" opacity=".35"/><circle cx="146" cy="128" r="6" fill="${m.d}" opacity=".35"/><circle cx="128" cy="154" r="4" fill="${m.d}" opacity=".35"/>`;   // macchie d'inchiostro
  if (m.armor) s += `<path d="M58 122 Q100 108 142 122 L138 150 Q100 162 62 150 Z" fill="#9CA3B8" stroke="#33324A" stroke-width="2.5"/><path d="M80 118 L80 156 M100 114 L100 160 M120 118 L120 156" stroke="#33324A" stroke-width="1.5" opacity=".6"/>`;
  s += hurt ? `<path d="M64 90 l16 12 M80 90 l-16 12 M122 90 l16 12 M138 90 l-16 12" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`
            : `<ellipse cx="74" cy="96" rx="14" ry="16" fill="#fff"/><ellipse cx="128" cy="96" rx="14" ry="16" fill="#fff"/><circle cx="78" cy="100" r="7" fill="#2B2340"/><circle cx="124" cy="100" r="7" fill="#2B2340"/>` +
              `<path d="M58 74 L88 84 M144 74 L114 84" stroke="${m.d}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<path d="M70 124 Q100 ${hurt ? 116 : 140} 132 124" stroke="#2B2340" stroke-width="4" fill="${hurt ? "none" : "#2B2340"}" stroke-linejoin="round"/>`;
  if (!hurt) s += `<path d="M80 128 l5 8 l5 -6 M112 130 l5 6 l5 -8" fill="#fff"/>`;
  s += words.map((w, i) => `<text x="${[12, 150, 4, 160, 70][i]}" y="${[30, 24, 66, 60, 16][i]}" font-family="Georgia,serif" font-size="13" font-style="italic" fill="${m.d}" opacity=".55" transform="rotate(${[-12, 10, -6, 8, -3][i]} ${[12, 150, 4, 160, 70][i]} ${[30, 24, 66, 60, 16][i]})">${w}</text>`).join("");
  return `<svg class="monster${hurt ? " hit" : ""}" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="${m.n}">${s}</svg>`;

</script>
<script>
// ============================================================
//  MISSIONE GRAMMATICA — motore dell'app v0.1
// ============================================================
"use strict";

const SK = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const AR = Object.fromEntries(AREAS.map(a => [a.id, a]));
const IT = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const INTERVALS = [0, 1, 2, 4, 8, 16];          // giorni per scatola Leitner 0..5
const ALPHA = 0.25;                              // velocità media mobile padronanza
const MASTER_M = 0.85, MASTER_N = 8;             // soglia "abilità conquistata"
const RAFFICA_SEC = 75;

// ---------------- utilità ----------------
const $ = s => document.querySelector(s);
const app = () => $("#app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, "0");
function dayKey(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dayNum(d = new Date()) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function keyToNum(k) { const [y, m, d] = k.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function levelOf(xp) { let L = 1; while (xp >= 50 * L * (L + 1)) L++; return L; }
function levelBounds(L) { return [L === 1 ? 0 : 50 * (L - 1) * L, 50 * L * (L + 1)]; }

// ---------------- stato ----------------
function freshState() {
  const skills = {};
  SKILLS.forEach(s => skills[s.id] = { m: 0, n: 0, c: 0, ever: false });
  return { v: 3, name: "", created: Date.now(), updatedAt: 0, diagDone: false, xp: 0, streak: 0, best: 0,
           freezes: 1, lastDay: null, sessions: 0, focus: null, skills, items: {}, days: {}, avatar: Object.assign({}, AVATAR_DEFAULT), line: "fuoco", hatchXp: 0, collection: [] };
}
let S = freshState();
function normalize(st) {   // aggiunge abilità nuove se la banca cresce
  const f = freshState();
  st = Object.assign(f, st);
  st.avatar = Object.assign({}, AVATAR_DEFAULT, st.avatar || {});
  if ((st.v || 1) < 2) {   // v0.3: tempi e cu/qu erano sovrastimati (solo esercizi a scelta)
    ["gr_tempi", "ort_q"].forEach(id => { const x = st.skills[id]; if (x && !x.ever) x.m = Math.min(x.m, 0.45); });
    if (st.focus && SK[st.focus] && AR[SK[st.focus].area].later) st.focus = null;
    st.v = 2;
  }
  if (st.v < 3) {   // v1.4: gli errori ancora da recuperare vengono riconosciuti anche nei progressi già esistenti
    const today = dayNum();
    Object.values(st.items || {}).forEach(it => { if (it.b <= 1 && it.c < it.n && it.lw === undefined) it.lw = today; });
    st.v = 3;
  }
  SKILLS.forEach(s => { if (!st.skills[s.id]) st.skills[s.id] = { m: 0, n: 0, c: 0, ever: false }; });
  return st;
}

// ---------------- salvataggio (server + copia locale) ----------------
const LS_KEY = "missione-grammatica-v1";
const DOC_PATH = "progress/main";
const Store = {
  db: null, ref: null, writing: false, pending: false, timer: null, status: "locale",
  loadLocal() { try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} },
  async connect(onRemote) {
    if (!(window.claude && typeof window.claude.use === "function")) return;
    try {
      const db = await window.claude.use("db");
      if (!db) return;
      this.db = db; this.ref = db.doc(DOC_PATH);
      const snap = await Promise.race([this.ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
      this.status = "online";
      if (snap.exists) {
        const remote = snap.data();
        if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) onRemote(JSON.parse(JSON.stringify(remote)));
        else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) this.schedule();
      } else if (S.updatedAt) this.schedule();
    } catch (e) { this.status = "locale"; this.ref = null; }
    updateSyncBadge();
  },
  save() { S.updatedAt = Date.now(); this.saveLocal(); this.schedule(); },
  schedule() { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200); },
  async flush() {
    if (!this.ref) return;
    if (this.writing) { this.pending = true; return; }
    this.writing = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(S))); this.status = "online"; }
    catch (e) { this.status = (e && e.code === "invalid_argument") ? "sola lettura" : "locale"; if (e && e.code === "unavailable") setTimeout(() => this.schedule(), 3000); }
    this.writing = false; updateSyncBadge();
    if (this.pending) { this.pending = false; this.flush(); }
  },
};
function updateSyncBadge() { const b = $("#sync"); if (!b) return; const l = typeof Sync !== "undefined" && Sync.on() ? Sync.label() : ""; b.textContent = l || (Store.status === "online" ? "☁️ salvato" : "💾 salvato su questo dispositivo"); }

// ---------------- modello dello studente ----------------
const sk = id => S.skills[id];
const isMastered = id => sk(id).ever;
const compXp = (xp = S.xp) => Math.max(0, xp - (S.hatchXp || 0));
const curStage = (xp = S.xp) => stageOf(compXp(xp), S.line);
const curStages = () => stagesOf(S.line);
const pet = (size, uid, scene = true) => creatureSVG(S.avatar, curStage(), size, uid || "p", S.line, scene);
const iceBest = () => Math.max(S.iceBest || 0, S.line === "ghiaccio" ? curStage() : 0, (S.collection || []).some(c => c.line === "ghiaccio") ? FINAL_STAGE : 0);
const hasPerk = id => { const p = PERKS.find(x => x.id === id); return !!p && iceBest() >= p.stage; };
const canHatch = () => curStage() >= FINAL_STAGE && !!nextLine(S.line);
const todaySessions = () => (S.days[dayKey()] || {}).sess || 0;
const petName = () => S.avatar.name ? esc(S.avatar.name) : "il tuo compagno";
function isAvailable(id) {
  const s = sk(id);
  const solid = p => sk(p).ever || (sk(p).m >= 0.8 && sk(p).n >= 5);   // prerequisito "abbastanza solido"
  return s.ever || SK[id].pre.every(solid) || (s.m >= 0.8 && s.n >= 2);
}
const unseenCount = id => ITEMS.filter(i => i.s === id && !S.items[i.id]).length;
const hasNews = id => isMastered(id) && unseenCount(id) >= 5;   // abilità conquistata ma con esercizi nuovi da scoprire
const isErr = it => it && it.lw !== undefined && it.b <= 1;     // sbagliato e non ancora recuperato
const errItems = id => ITEMS.filter(i => i.s === id && isErr(S.items[i.id]));
const needsBoost = id => isMastered(id) && sk(id).m < 0.6 && errItems(id).length >= 2;   // conquistata, ma ora vacilla
function suggestFocus() {
  if (S.focus && isAvailable(S.focus) && (!isMastered(S.focus) || hasNews(S.focus) || needsBoost(S.focus))) return S.focus;
  if (S.focusChosen && isMastered(S.focusChosen)) S.focusChosen = null;
  let cands = SKILLS.filter(s => isAvailable(s.id) && (!isMastered(s.id) || hasNews(s.id) || needsBoost(s.id)));
  const now = cands.filter(s => !AR[s.area].later);
  if (now.length) cands = now;
  if (!cands.length) return null;
  // un'abilità conquistata con novità conta come "a metà strada": arriva dopo le lacune vere, ma non viene dimenticata
  const prio = id => needsBoost(id) ? sk(id).m - 1 : hasNews(id) ? 0.6 : sk(id).m;   // una base che vacilla passa davanti
  cands.sort((a, b) => prio(a.id) - prio(b.id) || SKILLS.indexOf(a) - SKILLS.indexOf(b));
  // rotazione tra le aree: sceglie l'area usata meno di recente, poi l'abilità più debole lì
  const hist = S.areaHist || (S.lastArea ? [S.lastArea] : []);
  const lastUse = a => hist.lastIndexOf(a);
  const best = cands.slice().sort((a, b) => lastUse(a.area) - lastUse(b.area))[0];

// ---------- bilanciamento della difficoltà (obiettivo ≈ 85% di risposte giuste) ----------
const TARGET_LOW = 0.70, TARGET_HIGH = 0.95, MAX_BOOSTS = 2;

  const known = pool.filter(i => S.items[i.id] && S.items[i.id].b >= 2);

function buildSession() {

  const focus = suggestFocus();
  const fresh = shuffle(ITEMS.filter(i => !S.items[i.id] && isMastered(i.s) && i.s !== focus && strongSkill(i.s))).slice(0, 2);
  const errs = shuffle(due.filter(i => isErr(S.items[i.id]))), others = shuffle(due.filter(i => !isErr(S.items[i.id])));
  const review = interleave(errs.concat(others).slice(0, 6).concat(fresh));
  const used = new Set(review.map(i => i.id));
  const warm = interleave(easyPool(new Set([...used, ...ITEMS.filter(i => i.s === focus).map(i => i.id)]))).slice(0, 2);
  warm.forEach(i => used.add(i.id));

  if (review.length) phases.push({ key: "ripasso", label: "🔁 Ripasso", items: review });

    const pool = ITEMS.filter(i => i.s === focus && !used.has(i.id));
    const unseen = pool.filter(i => !S.items[i.id]);
    const seen = pool.filter(i => S.items[i.id]).sort((a, b) => S.items[a.id].b - S.items[b.id].b || S.items[a.id].due - S.items[b.id].due);

    const boost = needsBoost(focus);
    const ordered = boost ? seen.filter(i => isErr(S.items[i.id])).concat(unseen, seen.filter(i => !isErr(S.items[i.id]))) : unseen.concat(seen);
    const typedAll = ordered.filter(i => i.t === "type"), restAll = ordered.filter(i => i.t !== "type");
    let typed = typedAll.slice(0, 3), rest = restAll.slice(0, 5 - typed.length);

// Prima di ogni domanda: se sta sbagliando troppo, inserisce un esercizio facile e

function balance(ph) {

// ---------------- sincronizzazione con un repository GitHub privato ----------------
// I progressi viaggiano in un file JSON del repository dei dati. La chiave (fine-grained token,
// solo "Contents" su quel repository) resta salvata su questo dispositivo, mai nel codice.
const SYNC_KEY = "incanto-sync-v1";
// Quale versione vince tra due dispositivi: quella con PIÙ PROGRESSI (gli XP non calano mai);
// la data di modifica decide solo a parità. Così un profilo vuoto non sovrascrive mai uno vero.
function progressScore(st) { return st && st.skills ? (st.xp || 0) * 10 + (st.sessions || 0) + (st.diagDone ? 1 : 0) : -1; }
function remoteWins(r, l) {
  if (!r || !r.skills) return false;
  const a = progressScore(r), b = progressScore(l);
  return a !== b ? a > b : (r.updatedAt || 0) > (l.updatedAt || 0);
}
const Sync = {
  cfg: null, status: "", lastOk: 0, busy: false, pushedAt: 0,
  load() { try { this.cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); } catch (e) { this.cfg = null; } return this.cfg; },
  saveCfg(c) { this.cfg = c; try { c ? localStorage.setItem(SYNC_KEY, JSON.stringify(c)) : localStorage.removeItem(SYNC_KEY); } catch (e) {} },
  on() { return IS_STANDALONE && !!(this.cfg && this.cfg.token && this.cfg.owner && this.cfg.repo); },
  url() { const c = this.cfg; return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path || "progressi.json"}`; },
  headers() { return { "Authorization": "Bearer " + this.cfg.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; },
  b64enc(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  b64dec(b64) { const bin = atob(b64.replace(/\s/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); },
  explain(code) {
    return code === 401 ? "chiave non valida o scaduta" : code === 403 ? "la chiave non ha il permesso di scrivere (serve Contents: Read and write)"
      : code === 404 ? "repository non trovato o non accessibile con questa chiave" : code === 0 ? "nessuna connessione a internet" : "errore " + code;
  },
  async get() {    // → { data, sha } oppure { data: null, sha: null } se il file non esiste ancora
    let r; try { r = await fetch(this.url() + "?t=" + Date.now(), { headers: this.headers(), cache: "no-store" }); } catch (e) { throw { code: 0 }; }
    if (r.status === 404) {
      let rr; try { rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(this.cfg.owner)}/${encodeURIComponent(this.cfg.repo)}`, { headers: this.headers() }); } catch (e) { throw { code: 0 }; }
      if (!rr.ok) throw { code: rr.status };
      return { data: null, sha: null };
    }
    if (!r.ok) throw { code: r.status };
    const j = await r.json();
    return { data: JSON.parse(this.b64dec(j.content)), sha: j.sha };
  },
  async put(sha, why) {
    const body = { message: `Progressi aggiornati — ${dayKey()} ${new Date().toTimeString().slice(0, 5)} (${why})`, content: this.b64enc(JSON.stringify(S, null, 1)) };
    if (sha) body.sha = sha;
    let r; try { r = await fetch(this.url(), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, this.headers()), body: JSON.stringify(body) }); } catch (e) { throw { code: 0 }; }
    if (!r.ok) throw { code: r.status };
  },
  // scarica: se in rete c'è una versione più recente, la usa
  async pull() {
    if (!this.on() || this.busy) return false;
    this.busy = true;
    try {
      const { data } = await this.get();
      this.ok();
      if (remoteWins(data, S)) { S = normalize(data); Store.saveLocal(); this.pushedAt = S.updatedAt; return true; }
      if (!data || progressScore(S) > progressScore(data)) { this.busy = false; await this.push("primo salvataggio"); }
      return false;
    } catch (e) { this.fail(e); return false; } finally { this.busy = false; }
  },
  // carica: salva i progressi, ma non sovrascrive mai una versione più recente arrivata da un altro dispositivo
  async push(why = "lezione") {
    if (!this.on() || this.busy) return;
    if ((S.updatedAt || 0) <= this.pushedAt) return;
    this.busy = true;
    try {
      const { data, sha } = await this.get();
      if (remoteWins(data, S)) {   // l'altro dispositivo è più avanti: prendo la sua versione
        S = normalize(data); Store.saveLocal(); this.pushedAt = S.updatedAt; this.ok(); if (!SESS) boot(); return;
      }
      await this.put(sha, why); this.pushedAt = S.updatedAt; this.ok();
    } catch (e) { this.fail(e); } finally { this.busy = false; updateSyncBadge(); }
  },
  ok() { this.status = "ok"; this.lastOk = Date.now(); this.err = ""; updateSyncBadge(); },
  fail(e) { this.status = "err"; this.err = this.explain(e && e.code !== undefined ? e.code : -1); updateSyncBadge(); },
  label() {
    if (!this.on()) return "";
    if (this.status === "ok") return "☁️ sincronizzato " + new Date(this.lastOk).toTimeString().slice(0, 5);
    if (this.status === "err") return "⚠️ sincronizzazione: " + this.err;
    return "☁️ sincronizzazione…";
  },
};

function renderDen(tab) {

  const slots = AVATAR_CATALOG.map(c => {
    const chips = c.items.map(i => {
      const locked = i.trophy ? (S.trophies || []).length < i.trophy : i.streak ? (S.best || 0) < i.streak : i.lv > lv, on = S.avatar[c.slot] === i.id, isNew = fresh.has(c.slot + ":" + i.id);
      return `<button class="chip ${on ? "on" : ""} ${locked ? "lock" : ""}" data-slot="${c.slot}" data-id="${i.id}" ${locked ? "disabled" : ""}>
        ${locked ? "🔒 " : i.trophy ? "🏆 " : i.streak ? "🔥 " : ""}${esc(i.name)}${locked ? ` <small>${i.trophy ? i.trophy + (i.trophy === 1 ? " trofeo" : " trofei") : i.streak ? i.streak + " giorni di fila" : "Liv. " + i.lv}</small>` : ""}${isNew ? ' <span class="badge">nuovo</span>' : ""}</button>`;

    + `<div class="coll-item cur">${pet(110, "ccur", false)}<b>${esc(S.avatar.name || STG[si].n)}</b><small>${LINES[S.line].icon} in crescita: ${esc(STG[si].n)}</small></div>`
    + LINE_ORDER.slice(LINE_ORDER.indexOf(S.line) + 1).map(() => `<div class="coll-item"><div class="q-mark big">?</div><b>???</b><small>Uovo ancora da trovare</small></div>`).join("");

  app().innerHTML = header() + `<section class="card">
    <div class="den">
      <div class="den-pet"><div class="float">${pet(220, "den")}</div>
        <label class="lbl">Nome del tuo compagno</label>
        <input id="pname" class="inp" maxlength="18" placeholder="Dagli un nome!" value="${esc(S.avatar.name || "")}" autocomplete="off">
        <p class="muted">${esc(STG[si].n)} · Livello ${lv}${nx ? `<br>Prossimo sblocco al livello ${nx.lv}: <b>???</b>` : ""}</p>
      </div>
      <div class="den-side">
        <div class="tabs"><button class="tab ${tab === "look" ? "on" : ""}" data-t="look">🎨 Aspetto</button><button class="tab ${tab === "pow" ? "on" : ""}" data-t="pow">✨ Poteri</button><button class="tab ${tab === "evo" ? "on" : ""}" data-t="evo">🧬 Evoluzione</button><button class="tab ${tab === "coll" ? "on" : ""}" data-t="coll">🏆 Collezione</button></div>

  const nm = $("#pname"); let t; nm.oninput = () => { S.avatar.name = nm.value.trim(); clearTimeout(t); t = setTimeout(() => Store.save(), 600); };
  $("#back").onclick = () => { S.avatar.name = nm.value.trim(); Store.save(); renderHome(); };
}

window.addEventListener("error", e => {

  if (document.querySelector("#oops")) return;
  const d = document.createElement("div"); d.id = "oops";
  d.innerHTML = `<div class="oops-card"><div style="font-size:2.5rem">🛠️</div><h2>Ops, qualcosa si è inceppato</h2><p>I tuoi progressi sono salvati.</p><button class="btn primary" id="oops-go">Torna alla base</button></div>`;
  document.body.appendChild(d);
  document.querySelector("#oops-go").onclick = () => { d.remove(); keyHandler = null; SESS = null; try { boot(); } catch (_) { location.reload(); } };
});

// lo Specchio aiuta solo dove non regala la risposta: in missione, con almeno 3 scelte o da scrivere
function mirrorOk(item, ph) {
  if (!SESS || SESS.mode !== "session" || ph.key !== "nuovo" || SESS.mirrorUsed || !hasPerk("mirror")) return false;
  return item.t === "type" || (item.o && item.o.length >= 3) || (item.c && item.c.length >= 3);
}

function syncPanel() {
  const c = Sync.cfg || {};
  const on = Sync.on();
  return `<h3>☁️ Sincronizzazione</h3>
    <p class="muted">Salva i progressi in un repository GitHub <b>privato</b>, così PC e telefono restano allineati e nulla va perso.</p>
    <div class="syncbox">
      <label>Proprietario <input id="sy-owner" class="inp" value="${esc(c.owner || "felicat-hub")}" autocomplete="off"></label>
      <label>Repository dei dati <input id="sy-repo" class="inp" value="${esc(c.repo || "IncantoParolum-dati")}" autocomplete="off"></label>
      <label>Chiave (fine-grained token) <input id="sy-token" class="inp" type="password" placeholder="${on ? "•••••• chiave salvata" : "github_pat_…"}" autocomplete="off"></label>
    </div>
    <div class="row left"><button class="btn primary" id="sy-save">${on ? "Aggiorna e prova" : "Collega e prova"}</button>${on ? `<button class="btn" id="sy-now">Sincronizza ora</button><button class="btn ghost" id="sy-off">Scollega</button>` : ""}</div>
    <p class="muted" id="sy-status">${on ? esc(Sync.label() || "Collegato.") : "Non collegato: i progressi restano solo su questo dispositivo."}</p>`;
}
function wireSyncPanel() {
  const st = m => { const e = $("#sy-status"); if (e) e.textContent = m; };
  $("#sy-save").onclick = async () => {
    const prev = Sync.cfg || {};
    const cfg = { owner: $("#sy-owner").value.trim(), repo: $("#sy-repo").value.trim(), token: $("#sy-token").value.trim() || prev.token || "", path: "progressi.json" };
    if (!cfg.owner || !cfg.repo || !cfg.token) { st("Compila proprietario, repository e chiave."); return; }
    Sync.saveCfg(cfg); Sync.pushedAt = 0; st("Provo il collegamento…");
    try {
      const { data } = await Sync.get(); Sync.ok();
      if (remoteWins(data, S)) {
        st(`Collegato ✅ In rete ci sono progressi più recenti (${esc(data.name || "")}, ${data.xp || 0} XP): li ho caricati.`);
        S = normalize(data); Store.saveLocal(); Sync.pushedAt = S.updatedAt;
      } else if (data && data.skills && progressScore(data) === progressScore(S)) { Sync.pushedAt = S.updatedAt; st("Collegato ✅ I progressi in rete e su questo dispositivo sono già allineati."); }
      else { S.updatedAt = Math.max(S.updatedAt || 0, Date.now()); Store.saveLocal(); await Sync.push("collegamento"); st(Sync.status === "ok" ? `Collegato ✅ Progressi di questo dispositivo (${S.xp} XP) salvati in rete.` : "⚠️ " + Sync.err); }
    } catch (e) { Sync.fail(e); st("⚠️ Non riesco a collegarmi: " + Sync.err + "."); }
  };
  if ($("#sy-now")) $("#sy-now").onclick = async () => { st("Sincronizzo…"); const changed = await Sync.pull(); if (!changed) { Sync.pushedAt = 0; await Sync.push("manuale"); } st(Sync.status === "ok" ? "✅ " + Sync.label() : "⚠️ " + Sync.err); };
  if ($("#sy-off")) $("#sy-off").onclick = () => { Sync.saveCfg(null); renderParent(); };
}

function recentErrorsHTML() {
  const today = dayNum();
  const list = ITEMS.filter(i => { const it = S.items[i.id]; return isErr(it) && today - it.lw <= 21; })
    .sort((a, b) => S.items[b.id].lw - S.items[a.id].lw);
  if (!list.length) return `<p class="muted">Nessun errore in sospeso 👍</p>`;
  const bySkill = {};
  list.forEach(i => (bySkill[i.s] = bySkill[i.s] || []).push(i));
  return `<div class="errs">${Object.entries(bySkill).map(([sid, its]) => `<div><b>${SK[sid].icon} ${esc(SK[sid].name)}</b>${needsBoost(sid) ? ' <span class="tag mid">da rinforzare</span>' : ""}<br>${its.map(i => `<span class="errw" title="${esc(i.q)}">${esc(correctText(i))}</span>`).join(" ")}</div>`).join("")}</div>
    <p class="muted">Tornano per primi nei prossimi ripassi; quando li risponde giusti, escono dall'elenco.</p>`;
}

// ======================= IL DUELLO DELLA SETTIMANA =======================
// Ripasso misto delle abilità conquistate, travestito da combattimento.
// Per far variare gli incantesimi: mano di 3 pescata a favore dei più deboli, ricarica di 2 turni,
// punti deboli (×2) sulle abilità da allenare, corazza (½) su quelle più usate, catena di 3 diversi.
const DUEL = { HP: 150, HEARTS: 5, BASE: 15, COOLDOWN: 2, CHAIN: 10, MIN_SPELLS: 3 };
function weekKey(d = new Date()) { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return dayKey(x); }   // lunedì della settimana
const spells = () => SKILLS.filter(s => isMastered(s.id));
const duelReady = () => spells().length >= DUEL.MIN_SPELLS && (S.duel || {}).week !== weekKey();
function weekMonster() { const n = Math.floor(keyToNum(weekKey()) / 7); return MONSTERS[((n % MONSTERS.length) + MONSTERS.length) % MONSTERS.length]; }

function setupDuel() {
  const sp = spells().map(s => s.id);
  const use = S.duelUse || {};
  // corazza: l'incantesimo più usato nei duelli passati (al primo duello: quello più padroneggiato)
  const byUse = sp.slice().sort((a, b) => (use[b] || 0) - (use[a] || 0) || sk(b).m - sk(a).m);
  const resist = [byUse[0]];
  // punti deboli: le abilità conquistate dove serve più allenamento
  const weak = sp.filter(id => !resist.includes(id))
    .sort((a, b) => (needsBoost(b) - needsBoost(a)) || (errItems(b).length - errItems(a).length) || (sk(a).m - sk(b).m)).slice(0, 2);
  return { monster: weekMonster(), hp: DUEL.HP, hearts: DUEL.HEARTS, turn: 0, last: [], cool: {}, used: {}, offered: {}, okBy: {}, weak, resist, seen: new Set(), log: [] };
}
function spellPower(id, D) {
  let m = D.weak.includes(id) ? 2 : D.resist.includes(id) || (D.used[id] || 0) >= 3 ? 0.5 : 1;
  const instab = Math.min(1.3, 1 + (1 - sk(id).m) * 0.5);   // meno è solida, più è potente (ma rischiosa)
  return { mult: m, instab };
}
function drawHand(D) {
  let pool = spells().map(s => s.id).filter(id => !(D.cool[id] > 0));
  if (pool.length === 0) pool = spells().map(s => s.id);
  const w = id => 1 + 3 * (1 - sk(id).m) + (errItems(id).length ? 2 : 0) + (D.weak.includes(id) ? 3 : 0) - (D.resist.includes(id) ? 0.5 : 0);
  const hand = [];
  while (hand.length < 3 && pool.length) {
    const tot = pool.reduce((a, id) => a + w(id), 0); let r = Math.random() * tot, k = 0;
    for (; k < pool.length - 1; k++) { r -= w(pool[k]); if (r <= 0) break; }
    hand.push(pool.splice(k, 1)[0]);
  }
  hand.forEach(id => D.offered[id] = (D.offered[id] || 0) + 1);
  return hand;
}
function duelItem(id, D) {
  const its = ITEMS.filter(i => i.s === id && !D.seen.has(i.id));
  const err = its.filter(i => isErr(S.items[i.id])), seen = its.filter(i => S.items[i.id] && !isErr(S.items[i.id])).sort((a, b) => S.items[a.id].b - S.items[b.id].b), unseen = its.filter(i => !S.items[i.id]);
  const pick = shuffle(err)[0] || seen[0] || shuffle(unseen)[0] || shuffle(ITEMS.filter(i => i.s === id))[0];
  D.seen.add(pick.id); return pick;
}
const spellTag = (id, D) => { const p = spellPower(id, D); return p.mult === 2 ? `<span class="stag weak">💥 punto debole ×2</span>` : p.mult === 0.5 ? `<span class="stag res">🛡️ corazza ½</span>` : p.instab >= 1.12 ? `<span class="stag ins">⚡ instabile</span>` : `<span class="stag">affidabile</span>`; };

function duelIntro() {
  keyHandler = null;
  const D = SESS.duel = setupDuel(), M = D.monster;
  app().innerHTML = `<header class="top sess"><div class="phase">⚔️ Duello della settimana</div></header>
  <section class="card center duel">
    <div class="duel-row"><div>${pet(140, "dp", false)}</div><div class="vs">VS</div><div>${monsterSVG(M, 150)}</div></div>
    <h2>${esc(M.n)} ti sfida!</h2>
    <p>Ha rubato le parole del regno e le ha riempite di errori. Usa gli incantesimi del tuo Grimorio per sconfiggerlo!</p>
    <div class="duel-rules">
      <p>💥 <b>Teme:</b> ${D.weak.map(id => `${powerOf(id).icon} ${esc(powerOf(id).name)}`).join(", ") || "–"}</p>
      <p>🛡️ <b>Corazzato contro:</b> ${D.resist.map(id => `${powerOf(id).icon} ${esc(powerOf(id).name)}`).join(", ")}</p>
      <p class="muted">A ogni turno scegli 1 incantesimo tra 3. Dopo averlo usato si ricarica per 2 turni. Tre incantesimi diversi di fila = <b>Catena!</b> Nessuna fretta: pensa bene.</p>
    </div>
    <button class="btn primary big" id="fight">Al duello! ⚔️</button>
  </section>`;
  $("#fight").onclick = duelTurn;
}
function duelHeader(D, hurt) {
  const pct = Math.max(0, D.hp) / DUEL.HP * 100;
  return `<header class="top sess"><div class="phase">⚔️ ${esc(D.monster.n)}</div><div class="pill">${"❤️".repeat(D.hearts)}${"🤍".repeat(DUEL.HEARTS - D.hearts)}</div></header>
    <div class="duel-hud"><div class="mini-pet">${pet(70, "dh" + D.turn, false)}</div>
      <div class="hpwrap"><div class="hpbar"><i style="width:${pct}%"></i></div><small>${Math.max(0, Math.round(D.hp))} / ${DUEL.HP}</small></div>
      <div class="mini-mon">${monsterSVG(D.monster, 80, hurt)}</div></div>`;
}
function duelTurn() {
  const D = SESS.duel; if (!D) return;
  if (D.hp <= 0 || D.hearts <= 0) return duelEnd();
  Object.keys(D.cool).forEach(k => D.cool[k] = Math.max(0, D.cool[k] - 1));
  const hand = drawHand(D);
  const chainReady = D.last.length >= 2 && D.last[D.last.length - 1] !== D.last[D.last.length - 2];
  app().innerHTML = duelHeader(D) + `<section class="card">
    <h3 class="center">Scegli l'incantesimo da lanciare</h3>
    <div class="hand">${hand.map(id => { const P = powerOf(id), d = spellPower(id, D), next = chainReady && !D.last.slice(-2).includes(id);
      return `<button class="spell" data-id="${id}"><span class="si">${P.icon}</span><b>${esc(P.name)}</b><small>${esc(SK[id].name)}</small>${spellTag(id, D)}${next ? `<span class="stag chain">⛓️ Catena!</span>` : ""}</button>`; }).join("")}</div>
  </section>`;
  document.querySelectorAll(".spell").forEach(b => b.onclick = () => duelCast(b.dataset.id));
}
function duelCast(id) {
  const D = SESS.duel, item = duelItem(id, D), P = powerOf(id), s = SK[id], a = AR[s.area];
  D.turn++;
  app().innerHTML = duelHeader(D) + `<section class="card qcard" style="--c:${a.color};--s:${a.soft}">
    <div class="qtag">${P.icon} ${esc(P.name)} · ${esc(s.name)}</div>${renderItemBody(item)}<div id="fb"></div></section>`;
  let done = false;
  wireAnswers(item, (ok, el, typed) => {
    if (done) return; done = true;
    const res = record(item, ok, "duello"); SESS.xp += res.gain; SESS.tot++; if (ok) SESS.ok++;
    if (res.newlyMastered) SESS.mastered.push(item.s);
    markAnswer(item, ok, el); Store.save();
    D.used[id] = (D.used[id] || 0) + 1; D.cool[id] = DUEL.COOLDOWN + 1;
    const ob = D.okBy[id] || (D.okBy[id] = [0, 0]); ob[1]++; if (ok) ob[0]++;
    let msg;
    if (ok) {
      const p = spellPower(id, D);
      const chain = D.last.length >= 2 && new Set([D.last[D.last.length - 2], D.last[D.last.length - 1], id]).size === 3;
      const dmg = Math.round(DUEL.BASE * p.mult * p.instab) + (chain ? DUEL.CHAIN : 0);
      D.hp -= dmg;
      msg = `<div class="fb-t">${P.icon} Colpito! <span class="dmg">−${dmg}</span></div>
        ${p.mult === 2 ? "<p>💥 Punto debole! Danno doppio.</p>" : p.mult === 0.5 ? "<p>🛡️ Il mostro si è difeso con la corazza: danno dimezzato. Prova un altro incantesimo!</p>" : ""}
        ${chain ? "<p>⛓️ <b>Catena di incantesimi!</b> +10 di danno.</p>" : ""}${(D.used[id] === 3 && !D.resist.includes(id)) ? "<p>👀 Il mostro si sta abituando a questo incantesimo…</p>" : ""}`;
    } else {
      D.hearts--;
      msg = `<div class="fb-t">Il mostro contrattacca! 💢</div>${typed !== undefined ? `<p>Hai scritto: <s>${esc(typed)}</s></p>` : ""}<p>Risposta giusta: <b>${esc(correctText(item))}</b></p><p>${item.x}</p>`;
    }
    D.last.push(id); D.log.push([id, ok ? 1 : 0]);
    const fb = $("#fb"); fb.className = "fb " + (ok ? "good" : "bad");
    fb.innerHTML = msg + `<button class="btn ${ok ? "primary" : "warn"}" id="cont">${D.hp <= 0 ? "Finisci il mostro! ✨" : D.hearts <= 0 ? "Continua" : "Prossimo turno ▶"}</button>`;
    if (ok) { const m = document.querySelector(".mini-mon"); if (m) m.innerHTML = monsterSVG(D.monster, 80, true); }
    $(".hpbar i").style.width = Math.max(0, D.hp) / DUEL.HP * 100 + "%";
    const hpTxt = document.querySelector(".hpwrap small"); if (hpTxt) hpTxt.textContent = Math.max(0, Math.round(D.hp)) + " / " + DUEL.HP;
    const go = () => duelTurn(); $("#cont").onclick = go; $("#cont").focus();
    keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); go(); } };
  });
}
function duelEnd() {
  keyHandler = null;
  const D = SESS.duel, win = D.hp <= 0, M = D.monster;
  S.duel = { week: weekKey(), result: win ? "win" : "flee" };
  S.duelUse = S.duelUse || {}; Object.entries(D.used).forEach(([k, v]) => S.duelUse[k] = (S.duelUse[k] || 0) + v);
  const trophiesBefore = (S.trophies || []).length;
  if (win) { S.trophies = (S.trophies || []).concat([{ n: M.n, c: M.c, d: dayKey() }]); S.xp += 50; SESS.xp += 50; }
  S.duelLog = (S.duelLog || []).concat([{ d: dayKey(), m: M.n, win, turns: D.turn, hearts: D.hearts, used: D.used, offered: D.offered, ok: D.okBy, weak: D.weak, resist: D.resist }]).slice(-20);
  Store.save();
  const newItems = []; AVATAR_CATALOG.forEach(c => c.items.forEach(i => { if (i.trophy && i.trophy > trophiesBefore && i.trophy <= (S.trophies || []).length) newItems.push(i); }));
  SESS.duelResult = win ? "win" : "flee";
  app().innerHTML = `<header class="top sess"><div class="phase">⚔️ Duello della settimana</div></header><section class="card center duel">
    ${win ? `<div class="duel-row"><div class="float">${pet(150, "dw", true)}</div><div>${monsterSVG(M, 110, true)}</div></div>
      <h2>Hai sconfitto il ${esc(M.n)}! 🏆</h2><p>Le parole del regno sono salve. Hai vinto un <b>trofeo</b> e <b>+50 XP</b>.</p>`
          : `<div class="duel-row"><div>${pet(140, "dl", false)}</div><div class="wob">${monsterSVG(M, 130)}</div></div>
      <h2>Il ${esc(M.n)} è scappato!</h2><p>Non hai perso niente: tornerà la settimana prossima, e tu sarai più forte.</p>`}
    ${newItems.length ? `<div class="levelup"><b>🎁 Premio del duellante!</b><p>Sbloccato: ${newItems.map(i => `<b>${esc(i.name)}</b>`).join(", ")}</p></div>` : ""}
    <p class="muted">Incantesimi lanciati: ${Object.entries(D.used).map(([k, v]) => `${powerOf(k).icon}×${v}`).join(" ")}</p>
    <button class="btn primary big" id="cont">Continua ▶</button></section>`;
  $("#cont").onclick = () => { SESS.pi++; SESS.qi = 0; next(); };
}

function duelsHTML() {
  const L = (S.duelLog || []).slice(-6).reverse();
  if (!L.length) return `<p class="muted">${spells().length >= DUEL.MIN_SPELLS ? "Il primo duello arriverà alla fine di una delle prossime lezioni." : `I duelli iniziano quando ha conquistato almeno ${DUEL.MIN_SPELLS} abilità.`}</p>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Giorno</th><th>Esito</th><th>Incantesimi scelti (giuste/lanci)</th><th>Offerti ma mai scelti</th></tr></thead><tbody>${L.map(l => {
    const usedTxt = Object.entries(l.ok || {}).map(([k, [c, n]]) => `${powerOf(k).icon} ${esc(SK[k] ? SK[k].name : k)} <b>${c}/${n}</b>${(l.weak || []).includes(k) ? " 💥" : (l.resist || []).includes(k) ? " 🛡️" : ""}`).join("<br>");
    const avoided = Object.keys(l.offered || {}).filter(k => !(l.used || {})[k]).map(k => `${powerOf(k).icon} ${esc(SK[k] ? SK[k].name : k)}`).join("<br>") || "–";
    return `<tr><td>${l.d.split("-").reverse().slice(0, 2).join("/")}</td><td>${l.win ? "🏆 vinto" : "💨 scappato"}<br><small>${l.turns} turni</small></td><td><small>${usedTxt}</small></td><td><small>${avoided}</small></td></tr>`; }).join("")}</tbody></table></div>
    <p class="muted">💥 = punto debole del mostro (abilità da allenare) · 🛡️ = corazza (incantesimo più usato). Se un incantesimo compare spesso tra gli "offerti ma mai scelti", Nicola lo sta evitando.</p>`;
}

// ---------------- avvio (in fondo, così ogni parte dell'app è già definita) ----------------
(function init() {
  const local = Store.loadLocal(); if (local) S = normalize(local);
  boot();
  if (IS_STANDALONE && Sync.load()) Sync.pull().then(changed => { if (changed && !SESS) boot(); });
  // quando l'app va in secondo piano o si chiude, salva in rete se c'è qualcosa di nuovo
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && !SESS) Sync.push("chiusura"); });
  Store.connect(remote => {
    S = normalize(remote); Store.saveLocal();
    if (!SESS) boot();   // non interrompe una sessione in corso
  });
})();
