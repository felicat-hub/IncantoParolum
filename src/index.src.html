<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incanto Parolum</title>
<!--__PWA_HEAD__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EC;--ink:#2B2340;--muted:#6F6888;--card:#fff;--line:#EDE6DA;--pri:#6E56CF;--pri-d:#5241A8;--ok:#21A366;--ok-d:#178050;--ok-s:#E3F7EC;--bad:#E5484D;--bad-d:#B8353A;--bad-s:#FDECEC;--gold:#FFC53D;--c:#6E56CF;--s:#ECE6FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45}
#app{max-width:820px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:2rem;margin:.2em 0;font-weight:900}h2{font-size:1.45rem;margin:.2em 0 .4em;font-weight:900}h3{font-size:1.05rem;margin:1.2em 0 .5em;font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 0 var(--line)}
.center{text-align:center}
.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--ink);padding:11px 20px;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pri);border-color:var(--pri-d);color:#fff;box-shadow:0 4px 0 var(--pri-d)}
.btn.warn{background:var(--bad);border-color:var(--bad-d);color:#fff;box-shadow:0 4px 0 var(--bad-d)}
.btn.ghost{background:transparent}
.btn.big{display:block;width:100%;font-size:1.15rem;padding:15px;margin-top:14px}
.inp{font:inherit;width:100%;max-width:340px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin:6px 0 10px;text-align:center}
.inp:focus{outline:none;border-color:var(--pri)}
.ta{max-width:100%;height:110px;text-align:left;font-size:.75rem;font-family:ui-monospace,monospace}
.lbl{display:block;font-weight:800;margin-top:10px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.95rem;display:flex;align-items:center;gap:6px}
.pill.lv .mini{display:inline-block;width:54px;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pill.lv .mini i{display:block;height:100%;background:var(--gold)}
.top.sess{justify-content:space-between}.phase{font-weight:900;flex:1}.phase small{color:var(--muted);font-weight:700}
.x{font:inherit;font-size:1.1rem;border:none;background:none;cursor:pointer;color:var(--muted);padding:4px 8px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px auto;max-width:380px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F1C);border-radius:99px;transition:width .5s}
.bar.prog{max-width:none;margin:10px 0 0}.bar.prog i{background:var(--ok)}
.bar.thin{display:inline-block;height:8px;width:70px;vertical-align:middle;margin:0 4px}.bar.thin i{background:var(--c)}
.big-emoji{font-size:5.5rem;line-height:1.1;display:inline-block}
.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
.wob{animation:wob 2.4s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(0)}}
.hero p{max-width:520px;margin:10px auto}
.hi{font-size:1.1rem;margin-top:0}
.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mission div{background:var(--bg);border-radius:14px;padding:10px 12px}.mission small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:.8rem}
/* mappa */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.col{background:var(--s);border-radius:18px;padding:10px}.col h3{color:var(--c);margin:.2em .2em .6em;text-align:center}
.node{font:inherit;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.node .ni{font-size:1.5rem}.node .nt{flex:1;font-size:.88rem;line-height:1.25}.node .nt b{display:block}.node .nt small{color:var(--muted)}.node .nb{font-size:1.1rem}
.node.locked{opacity:.55;cursor:not-allowed;box-shadow:none}
.node.done{border-color:var(--gold)}.node.focus{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
/* esercizi */
.qcard{border-color:var(--s)}
.trap{margin-top:10px;color:#2a2340;font-weight:500;background:#f3ecff;border-left:4px solid #7c3aed;border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.4}
.qtag.sfida{background:#fff1e0;color:#c2410c;margin-left:6px}
.qtag{display:inline-block;background:var(--s);color:var(--c);font-weight:800;font-size:.85rem;border-radius:99px;padding:3px 12px}
.q{font-size:1.3rem;font-weight:800;margin:16px 0}
.q.cloze{font-size:1.45rem}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--c);color:var(--c);text-align:center}
.blank.right{color:var(--ok);border-color:var(--ok);border-bottom-style:solid}.blank.fixed{color:var(--bad);border-color:var(--bad);border-bottom-style:solid}
.opts{display:grid;gap:10px}
.opt,.chunk{font:inherit;font-weight:800;font-size:1.15rem;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 16px;cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.opt:hover:not(:disabled),.chunk:hover:not(:disabled){border-color:var(--c)}
.opt kbd{display:inline-block;min-width:24px;margin-right:10px;color:var(--muted);font-family:inherit;font-size:.8rem;border:2px solid var(--line);border-radius:7px;text-align:center}
.chunks{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chunk{font-size:1.3rem;padding:12px 16px}
.right{background:var(--ok-s)!important;border-color:var(--ok)!important;box-shadow:0 4px 0 var(--ok)!important}
.wrong{background:var(--bad-s)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button:disabled{cursor:default}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px}
.fb.good{background:var(--ok-s);color:var(--ok-d)}.fb.bad{background:var(--bad-s);color:var(--bad-d)}
.fb p{margin:.3em 0;color:var(--ink)}
.fb-t{font-weight:900;font-size:1.25rem}.gain{background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 10px;font-size:.9rem;margin-left:6px}
.fb .btn{margin-top:10px}
.mini-fb{font-weight:900;text-align:center}
.mastered{background:#FFF4D6;border-radius:12px;padding:8px 12px;font-weight:800}
.note{background:var(--bg);border-radius:12px;padding:8px 12px}.note.bad{color:var(--bad-d)}
/* lezione */
.lesson{border-color:var(--c)}
.lesson-h{display:flex;gap:14px;align-items:center}.lesson-h .ni{font-size:2.6rem;background:var(--s);border-radius:16px;padding:6px 12px}.lesson-h small{color:var(--c);font-weight:800}
.rule{background:var(--s);border-radius:16px;padding:14px 16px;margin:14px 0;font-size:1.08rem}
.ex{padding-left:1.2em}.ex li{margin:6px 0}
/* raffica */
.timer{position:relative;height:26px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF6B6B,var(--gold));transition:width .2s linear}
.timer b{position:absolute;inset:0;text-align:center;font-size:.9rem;line-height:26px}
/* fine sessione / stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--bg);border-radius:14px;padding:10px}.stats b{display:block;font-size:1.4rem}.stats small{color:var(--muted);font-size:.78rem}
.evo{position:relative;height:6.5rem}.evo .big-emoji{position:absolute;left:50%;transform:translateX(-50%)}
.fade-out{animation:fo 1.2s forwards}@keyframes fo{60%{opacity:1;transform:translateX(-50%) scale(1.2)}100%{opacity:0;transform:translateX(-50%) scale(.2)}}
.pop{opacity:0;animation:pop .8s 1.1s forwards}@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.2)}70%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
/* diagnosi */
.diag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.diag-area{background:var(--s);border-radius:16px;padding:10px 12px}.diag-area h3{color:var(--c);margin:.2em 0 .4em}
.diag-area ul{list-style:none;padding:0;margin:0;font-size:.88rem}.diag-area li{margin:6px 0}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:4px}
.tag.ok{background:var(--ok-s);color:var(--ok-d)}.tag.mid{background:#FFF4D6;color:#9A6B00}.tag.lo{background:var(--bad-s);color:var(--bad-d)}
/* genitori */
.stats.left{text-align:center}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:420px}
.dday{aspect-ratio:1;border-radius:6px;background:var(--line)}.dday.on{background:var(--ok)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}.tbl th{font-size:.78rem;color:var(--muted)}.tbl small{color:var(--muted)}
.tbl .bar.thin i{background:var(--pri)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;transition:transform .25s;z-index:9}
#toast.show{transform:translateX(-50%) translateY(0)}
/* esercizi da scrivere */
.hint{color:var(--muted);margin:-6px 0 12px;font-weight:700}
.typebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp.ans{max-width:none;flex:1;min-width:200px;margin:0;text-align:left;font-size:1.25rem;font-weight:800}
.inp.ans.right{border-color:var(--ok);background:var(--ok-s)}.inp.ans.wrong{border-color:var(--bad);background:var(--bad-s)}
.accents{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acc{font:inherit;font-weight:800;min-width:40px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.later{font-size:.8rem;background:#fff;border-radius:10px;padding:6px 8px;margin:0 0 8px;color:var(--muted)}
#oops{position:fixed;inset:0;background:rgba(43,35,64,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.oops-card{background:#fff;border-radius:22px;padding:24px;text-align:center;max-width:340px}
/* carica, collezione, schiusa */
.pill.energy{font-size:.85rem}.pill.energy.full{background:#FFF8D6;border-color:#FFC53D}
.hatch{margin:10px auto 0;display:block}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.coll-item{background:var(--bg);border-radius:16px;padding:8px;text-align:center}.coll-item.cur{outline:3px solid var(--gold)}
.coll-item b{display:block;font-size:.9rem}.coll-item small{color:var(--muted);font-size:.75rem}
.q-mark.big{width:110px;height:110px;font-size:3rem}
.hatch-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.hatch-row small{display:block;color:var(--muted);font-weight:800}.hatch-row .arrow{font-size:2rem;color:var(--muted)}
.motto{margin:-4px 0 6px;font-style:italic;color:var(--muted);font-weight:700}
.formula{display:block;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
/* errori: spiegazione da leggere */
.why{background:#fff;border-left:5px solid var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:1.05rem;color:var(--ink)}
.diff{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}.diff small{display:block;color:var(--muted);font-weight:800;font-size:.75rem}
.diff .dw,.diff .dr{font-size:1.5rem;font-weight:900;letter-spacing:.04em;color:var(--ink)}.diff .arrow{font-size:1.4rem;color:var(--muted)}
.dx{color:var(--bad);text-decoration:line-through;text-decoration-thickness:3px}.di{background:#C9F2DD;color:var(--ok-d);border-radius:4px;padding:0 1px}
.right-ans{font-size:1.15rem}
.retype{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}.retype label{font-weight:800;color:var(--ink)}.retype .inp{max-width:240px;margin:0;text-align:left;font-weight:800}
.retype .inp.right{border-color:var(--ok);background:var(--ok-s)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
/* duello */
.duel-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.vs{font-size:2rem;font-weight:900;color:var(--bad)}
.duel-rules{background:var(--bg);border-radius:14px;padding:10px 14px;text-align:left;margin:10px 0}.duel-rules p{margin:.35em 0}
.duel-hud{display:flex;align-items:center;gap:10px;margin:10px 0}.hpwrap{flex:1;text-align:center}.hpwrap small{font-weight:800;color:var(--muted)}
.hpbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#E5484D,#FF8A3D);transition:width .5s}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spell{font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 8px;cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:center}
.spell:hover{border-color:var(--pri)}.spell .si{font-size:2rem}.spell small{color:var(--muted);font-size:.78rem}
.stag{font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;background:var(--bg);color:var(--muted)}
.stag.weak{background:#FFE8D7;color:#B54708}.stag.res{background:#E6E8EF;color:#4B4F63}.stag.ins{background:#FFF4D6;color:#9A6B00}.stag.chain{background:#ECE6FF;color:var(--pri-d)}
.dmg{background:var(--bad);color:#fff;border-radius:99px;padding:1px 10px;font-size:.9rem;margin-left:6px}
.monster.hit{animation:shake .4s}
.duel-banner{display:flex;align-items:center;gap:12px;border-color:#FFB4A0;background:#FFF5F0}
@media (max-width:640px){.hand{grid-template-columns:1fr}.spell{flex-direction:row;justify-content:flex-start;gap:8px;text-align:left}.spell small{display:none}}
/* novità */
.errs{display:grid;gap:8px}.errs>div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.9rem}
.errw{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin:3px 3px 0 0;font-weight:700}
.news{color:#B54708;font-weight:800}
/* sincronizzazione */
.btn.small{font-size:.85rem;padding:7px 12px;box-shadow:none}
.syncbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.syncbox label{font-size:.82rem;font-weight:800;color:var(--muted)}.syncbox .inp{text-align:left;max-width:none;font-size:.95rem}
.row.left{justify-content:flex-start}.row.left .inp{max-width:260px;margin:0;text-align:left}
@media (max-width:640px){.syncbox{grid-template-columns:1fr}}
/* telefono */
@media (pointer:coarse){.accents{display:none}}
@media (max-width:640px){.phase small{display:none}.phase{font-size:.92rem}.top.sess{flex-wrap:nowrap}.btn.perk small{display:none}}
/* poteri attivi */
.btn.perk{margin-top:12px;font-size:.92rem;background:#EAF8FF;border-color:#7CC8F0;box-shadow:0 4px 0 #7CC8F0}.btn.perk small{color:var(--muted)}
.gone{opacity:.25;text-decoration:line-through}
.perk-up{background:linear-gradient(90deg,#EAF8FF,#E6F0FF)}
h4.sub{margin:14px 0 6px}
.dragon.scene{border-radius:26px}
/* combo */
.pill.combo{transition:transform .2s}.pill.combo.hot{background:#FFF0E0;border-color:#FF9F1C;color:#B54708;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cmb{background:#FF9F1C;color:#fff;border-radius:99px;padding:1px 9px;font-size:.85rem;margin-left:4px;font-weight:900}
.soft{background:#FFF4D6;border-radius:10px;padding:6px 10px;color:var(--ink)!important}
.combo-pop{position:fixed;left:50%;top:62%;transform:translate(-50%,-50%);font-size:2.6rem;font-weight:900;color:#FF7A00;text-shadow:0 3px 0 #FFE0B2;pointer-events:none;animation:cpop 1.1s ease-out forwards;z-index:15}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* compagno, tana, poteri */
.petbox{display:inline-block}.dragon{display:block;margin:0 auto;overflow:visible}
.powers{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.pw{font-size:1.3rem;background:#FFF4D6;border-radius:12px;padding:3px 7px;cursor:help}.pw-n{font-size:.8rem;color:var(--muted);font-weight:800}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-size:.72rem;font-weight:900;vertical-align:middle}
.levelup{background:linear-gradient(90deg,#FFF4D6,#FFE7B0);border-radius:16px;padding:10px 14px;margin:10px 0}.levelup p{margin:.3em 0}.levelup small{color:var(--muted)}
.pw-up{background:linear-gradient(90deg,#ECE6FF,#DDF5EA)}
.den{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.den-pet{text-align:center;position:sticky;top:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer}.tab.on{background:var(--pri);color:#fff;border-color:var(--pri-d)}
.slot h4{margin:12px 0 6px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:.88rem;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 11px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip.on{border-color:var(--pri);background:#ECE6FF;box-shadow:0 3px 0 var(--pri)}
.chip.lock{opacity:.5;cursor:not-allowed;box-shadow:none}.chip small{color:var(--muted)}
.powers-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.power{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px;opacity:.6}.power.got{opacity:1;background:#FFF4D6}
.power .pi{font-size:1.6rem}.power small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.evo-line{display:flex;flex-wrap:wrap;gap:8px}
.evo-step{width:84px;text-align:center;background:var(--bg);border-radius:14px;padding:6px 4px;font-size:.75rem;opacity:.7}.evo-step.got{opacity:1}.evo-step.cur{outline:3px solid var(--gold)}
.evo-step small{display:block;font-weight:800;color:var(--muted)}
.q-mark{width:70px;height:70px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:var(--muted)}
.evo{position:relative;height:180px}.evo>span{position:absolute;left:50%;transform:translateX(-50%)}
@media (max-width:640px){.den{grid-template-columns:1fr}.den-pet{position:static}.powers-grid{grid-template-columns:1fr}}
@media (max-width:640px){.map,.diag-grid{grid-template-columns:1fr}.mission{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}html,body{font-size:16px}}
</style>
</head>
